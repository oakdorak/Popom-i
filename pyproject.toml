[project]
name = "popom-i"
version = "0.1.0"
description = "Popom-i Medical PWA"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
